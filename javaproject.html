<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Hand-Controlled Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 200px;
            height: 150px;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            opacity: 0.7;
            transform: scaleX(-1); /* Mirror the preview */
            z-index: 10;
        }
        #input-video { width: 100%; height: 100%; object-fit: cover; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 0.8rem; color: #aaa; }
        .controls {
            margin-top: 10px;
            pointer-events: auto;
        }
        button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: rgba(255,255,255,0.3); }
    </style>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="ui">
        <h1>Interactive Particle Morph</h1>
        <h1>Maker by KRISHNA </h1>
        <p>🖐 Open Hand: Float | 👌 Pinch: Attract/Collapse</p>
        <p>Status: <span id="status">Loading AI...</span></p>
        <div class="controls">
            <button onclick="nextShape()">Next Shape</button>
        </div>
    </div>

    <div id="video-container">
        <video id="input-video"></video>
    </div>

<script>
    // --- CONFIGURATION ---
    const PARTICLE_COUNT = 8000;
    const PARTICLE_SIZE = 0.15;
    const LERP_SPEED = 0.08; // How fast particles move to target
    
    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- PARTICLE SYSTEM ---
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    
    // Initialize random positions
    for(let i=0; i<PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 50;
        targetPositions[i] = positions[i];
        colors[i] = 1;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: PARTICLE_SIZE,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.8
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // --- STATE & INTERACTION ---
    let handPos = new THREE.Vector3(0, 0, 0);
    let isPinching = false;
    let isHandDetected = false;
    let currentShapeIndex = 0;
    
    // --- SHAPE GENERATORS ---
    
    // Helper: Random point in sphere
    function getSpherePoint() {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 10 + Math.random() * 2;
        return {
            x: r * Math.sin(phi) * Math.cos(theta),
            y: r * Math.sin(phi) * Math.sin(theta),
            z: r * Math.cos(phi),
            color: new THREE.Color(0x00ffff)
        };
    }

    // Helper: Heart Shape
    function getHeartPoint() {
        // Parametric equations for a 3D heart
        let u = Math.random() * Math.PI * 2;
        let v = Math.random() * Math.PI;
        
        // Simple 3D heart approximation
        const x = 16 * Math.pow(Math.sin(u), 3) * Math.sin(v);
        const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.sin(v);
        const z = 6 * Math.cos(v);
        
        // Scale down
        return {
            x: x * 0.5,
            y: y * 0.5,
            z: z * 0.5,
            color: new THREE.Color(0xff0055)
        };
    }

    // Helper: Saturn (Sphere + Ring)
    function getSaturnPoint(index) {
        const isRing = Math.random() > 0.6; 
        if (isRing) {
            const angle = Math.random() * Math.PI * 2;
            const r = 12 + Math.random() * 6; // Ring radius
            return {
                x: r * Math.cos(angle),
                y: (Math.random() - 0.5) * 1, // Flat-ish
                z: r * Math.sin(angle),
                color: new THREE.Color(0xffaa00)
            };
        } else {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 7; 
            return {
                x: r * Math.sin(phi) * Math.cos(theta),
                y: r * Math.sin(phi) * Math.sin(theta),
                z: r * Math.cos(phi),
                color: new THREE.Color(0xffddaa)
            };
        }
    }

    // Helper: Flower / Galaxy Spiral
    function getFlowerPoint() {
        const angle = Math.random() * Math.PI * 2 * 5; // 5 winds
        const r = Math.random() * 15;
        const spiralOffset = angle * 0.5;
        
        return {
            x: (r * Math.cos(angle + r*0.2)),
            y: (Math.random() - 0.5) * 5 * (1 - r/15), // Thicker at center
            z: (r * Math.sin(angle + r*0.2)),
            color: new THREE.Color().setHSL(r/20 + 0.5, 0.8, 0.5)
        };
    }

    const shapes = [getSpherePoint, getHeartPoint, getSaturnPoint, getFlowerPoint];

    function calculateTargetShape() {
        const shapeFunc = shapes[currentShapeIndex];
        const colorAttr = geometry.attributes.color;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const point = shapeFunc(i);
            
            targetPositions[i * 3] = point.x;
            targetPositions[i * 3 + 1] = point.y;
            targetPositions[i * 3 + 2] = point.z;

            // Update target colors slowly? For now immediate switch
            colorAttr.setXYZ(i, point.color.r, point.color.g, point.color.b);
        }
        colorAttr.needsUpdate = true;
    }

    window.nextShape = function() {
        currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
        calculateTargetShape();
    };

    // Initial calculation
    calculateTargetShape();

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        const time = clock.getElapsedTime();
        const posAttr = geometry.attributes.position;
        
        // Interaction Logic
        // Map hand tracking to 3D world space (approximate)
        // Hand coordinates are usually 0-1. Map to world -20 to 20
        const targetHandX = (handPos.x - 0.5) * 40; 
        const targetHandY = -(handPos.y - 0.5) * 30; // Y is inverted in video
        const targetHandZ = 0; // Keeping hand logic on a plane for simplicity

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const px = posAttr.getX(i);
            const py = posAttr.getY(i);
            const pz = posAttr.getZ(i);

            let tx = targetPositions[i * 3];
            let ty = targetPositions[i * 3 + 1];
            let tz = targetPositions[i * 3 + 2];

            // 1. Basic Shape Morphing (Lerp towards target shape)
            let vx = (tx - px) * LERP_SPEED;
            let vy = (ty - py) * LERP_SPEED;
            let vz = (tz - pz) * LERP_SPEED;
            
            // 2. Add some noise/wobble for aliveness
            vx += Math.sin(time + px * 0.1) * 0.02;
            vy += Math.cos(time + py * 0.1) * 0.02;

            // 3. Hand Interaction
            if (isHandDetected) {
                const dx = targetHandX - px;
                const dy = targetHandY - py;
                const dz = targetHandZ - pz;
                const distSq = dx*dx + dy*dy + dz*dz;
                const dist = Math.sqrt(distSq);

                if (isPinching) {
                    // ATTRACTION (Black Hole)
                    if (dist < 20) {
                        const force = (20 - dist) * 0.05;
                        vx += dx * force * 0.02;
                        vy += dy * force * 0.02;
                        vz += dz * force * 0.02;
                    }
                } else {
                    // REPULSION / TOUCH (Gentle push)
                    if (dist < 8) {
                        const force = (8 - dist);
                        vx -= dx * force * 0.03;
                        vy -= dy * force * 0.03;
                        vz -= dz * force * 0.03;
                    }
                }
            }

            posAttr.setXYZ(i, px + vx, py + vy, pz + vz);
        }

        posAttr.needsUpdate = true;
        
        // Rotate entire system slowly
        particles.rotation.y = time * 0.1;

        renderer.render(scene, camera);
    }
    
    animate();

    // --- MEDIAPIPE HAND TRACKING SETUP ---
    const videoElement = document.getElementById('input-video');
    const statusText = document.getElementById('status');

    function onResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            isHandDetected = true;
            statusText.innerText = "Hand Detected";
            statusText.style.color = "#0f0";

            const landmarks = results.multiHandLandmarks[0];

            // 1. Calculate Hand Position (using Index Finger Tip as cursor)
            // Or average of wrist and middle finger for palm center
            const indexTip = landmarks[8];
            const thumbTip = landmarks[4];
            
            // Smoothed position could be added here, but raw is okay for particles
            handPos.set(indexTip.x, indexTip.y, 0);

            // 2. Detect Pinch (Distance between Thumb (4) and Index (8))
            // Calculate Euclidean distance in 2D (video) coordinates
            const pinchDist = Math.sqrt(
                Math.pow(indexTip.x - thumbTip.x, 2) + 
                Math.pow(indexTip.y - thumbTip.y, 2)
            );

            // Threshold for pinch (tune this based on testing)
            if (pinchDist < 0.05) {
                isPinching = true;
                statusText.innerText = "Pinching (Attracting)";
            } else {
                isPinching = false;
            }

        } else {
            isHandDetected = false;
            isPinching = false;
            statusText.innerText = "No Hand";
            statusText.style.color = "#aaa";
        }
    }

    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 640,
        height: 480
    });

    cameraUtils.start();

    // Window Resize Handler
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Auto-cycle shapes every 8 seconds
    setInterval(nextShape, 8000);

</script>
</body>
</html>
